send_reading:
  name: Отправить одно показание
  description: Отправить значение напрямую в существующий канал Waterius по channel_id.
  fields:
    channel_id:
      name: Channel ID
      description: ID канала Waterius (/api/channel/<id>/).
      required: true
      example: 55170
      selector:
        number:
          min: 1
          max: 99999999
          mode: box
    value:
      name: Значение
      description: Накопительное показание счётчика.
      required: true
      example: 162.34
      selector:
        number:
          mode: box

send_all:
  name: Отправить все настроенные показания
  description: Прочитать текущие значения сопоставленных sensor.* / input_number.* Home Assistant и отправить их в Waterius.
  fields:
    entry_id:
      name: Config entry ID
      description: Необязательно. Нужно только если добавлено несколько экземпляров интеграции Waterius.
      required: false
      selector:
        text:

send_configured_reading:
  name: Отправить настроенные показания
  description: Совместимое имя старого сервиса. Отправляет все текущие сопоставленные sensor.* / input_number.* Home Assistant.
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:

send_all_to_waterius:
  name: Отправить показания в Waterius
  description: Совместимое имя старого сервиса. Отправляет все текущие сопоставленные sensor.* / input_number.* Home Assistant.
  fields:
    entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
